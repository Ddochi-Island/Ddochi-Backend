# 배포 서버(self-hosted runner) 전용 — 로컬 개발용 docker-compose.yml과 분리.
# django 컨테이너가 data_router를 서비스명(DNS)으로 찾도록 같은 네트워크에서 실행.
services:
  data_router:
    build:
      context: ./data_router
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_ADDR: :8080
      ORACLE_USER: ${DB_USER}
      ORACLE_PASSWORD: ${DB_PASSWORD}
      ORACLE_WALLET_DIR: ${TNS_ADMIN}
      ORACLE_SERVICE_ALIAS: ${DB_NAME}
      INTERNAL_API_TOKEN: ${DATA_ROUTER_TOKEN}
      STORAGE_ENABLED: "0"
    volumes:
      - ${TNS_ADMIN}:${TNS_ADMIN}:ro

  django:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_ROUTER_URL: http://data_router:8080
      TEL_ROUTER_URL: http://tel_router:8090
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - django_data:/data
    depends_on:
      - data_router

  cron_router:
    build:
      context: ./cron_router_py
    restart: unless-stopped
    environment:
      DATA_ROUTER_URL: http://data_router:8080
      DATA_ROUTER_TOKEN: ${DATA_ROUTER_TOKEN}
      DATA_ROUTER_CALLER: cron_router
      MAIN_URL: http://django:8000
      MAIN_INTERNAL_TELEGRAM_TOKEN: ${TELEGRAM_INTERNAL_TOKEN}
      SELF_TICK: "1"
    depends_on:
      - data_router
      - django

  tel_router:
    build:
      context: ./tel_router_py
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET}
      ENQUEUE_SECRET: ${TEL_ROUTER_ENQUEUE_SECRET}
      MAIN_SERVER_URL: http://django:8000
      MAIN_INTERNAL_TELEGRAM_TOKEN: ${TELEGRAM_INTERNAL_TOKEN}
      TG_CALLBACK_HMAC_SECRET: ${TG_CALLBACK_HMAC_SECRET}
    depends_on:
      - django

volumes:
  django_data:
